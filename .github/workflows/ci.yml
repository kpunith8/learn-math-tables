name: Next.js CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Dummy-safe defaults so CI runs without real credentials (tests mock Kinde
# auth and Turnstile). Override by adding the matching repo secrets.
env:
  KINDE_CLIENT_ID: ${{ secrets.KINDE_CLIENT_ID || 'ci_dummy' }}
  KINDE_CLIENT_SECRET: ${{ secrets.KINDE_CLIENT_SECRET || 'ci_dummy' }}
  KINDE_ISSUER_URL: ${{ secrets.KINDE_ISSUER_URL || 'https://ci-dummy.kinde.com' }}
  KINDE_SITE_URL: ${{ secrets.KINDE_SITE_URL || 'http://localhost:3000' }}
  KINDE_POST_LOGIN_REDIRECT_URL: ${{ secrets.KINDE_POST_LOGIN_REDIRECT_URL || 'http://localhost:3000' }}
  KINDE_POST_LOGOUT_REDIRECT_URL: ${{ secrets.KINDE_POST_LOGOUT_REDIRECT_URL || 'http://localhost:3000' }}
  TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET || 'ci_dummy' }}
  NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITEKEY || 'ci_dummy' }}
  TURNSTILE_HOSTNAMES: ${{ secrets.TURNSTILE_HOSTNAMES || '' }}

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build

  e2e:
    name: Playwright tests & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests & generate coverage
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
